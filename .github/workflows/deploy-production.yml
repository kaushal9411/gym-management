# ══════════════════════════════════════════════════════════════════════
# Deploy PRODUCTION — every push to `main` (after CI passes) SSHes into
# the single EC2 box running api/tenant-web/super-admin under pm2 and
# runs the same pull → install → migrate → build → pm2 restart sequence
# as infrastructure/testing-deploy/07-redeploy-via-git.sh, which this
# mirrors exactly. There is no container registry, ECS, or terraform in
# this project — this workflow targets the real, currently-running
# deployment, not a future one.
# ══════════════════════════════════════════════════════════════════════
name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH (git pull + build + pm2 restart)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy to production server
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # Default is 10m — building api+tenant-web+super-admin sequentially
          # on this box's small instance size started exceeding that once
          # firebase-admin (Prompt 89) pulled in a much heavier dependency
          # tree (most of the Google Cloud SDK — gRPC, Firestore, Storage
          # clients — just to use its messaging piece). Confirmed live: the
          # deploy got killed by this exact timeout mid-`tsc` build, not a
          # real build error (git/install/migrate all succeeded first).
          #
          # A later attempt to speed this up by building all 3 apps in
          # PARALLEL via `pnpm turbo run build` instead of sequentially was
          # reverted — this box only has ~900MB RAM, and 3 concurrent
          # TS/Next builds exhausted it badly enough that the deploy hung for
          # the full 30m timeout AND took the already-running pm2 processes
          # down with it (confirmed live: a real production outage, not just
          # a slow/failed deploy — see PROJECT-STATE.md). Sequential is
          # slower but proven not to repeat this; don't re-parallelize
          # without first confirming this box has materially more RAM.
          command_timeout: 30m
          script: |
            cd ~/gym-management
            export PATH="$PATH:$(npm config get prefix)/bin"
            export NODE_OPTIONS="--max-old-space-size=1536"

            echo "-- git fetch + reset --hard origin/main --"
            git fetch origin main
            git reset --hard origin/main

            echo "-- pnpm install --"
            pnpm install

            echo "-- prisma generate + migrate deploy (no-op if nothing changed) --"
            pnpm --filter @gym-saas/api run prisma:generate
            pnpm --filter @gym-saas/api exec prisma migrate deploy

            echo "-- building api/tenant-web/super-admin --"
            pnpm --filter @gym-saas/api run build
            pnpm --filter @gym-saas/tenant-web run build
            pnpm --filter @gym-saas/super-admin run build

            echo "-- restarting via pm2 --"
            pm2 restart fitcloud-api fitcloud-tenant-web fitcloud-super-admin
            pm2 save

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 30); do
            curl -sf https://api.appkraft.info/health -o /dev/null && exit 0
            sleep 5
          done
          echo "API health check failed after 150s" && exit 1

      - name: Email result
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "SUBJECT=FitCloud DEPLOY FAILED" >> "$GITHUB_ENV"
            echo "BODY=Deploy step failed (SSH/build/pm2 restart). See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          elif [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "SUBJECT=FitCloud DEPLOY partially failed (smoke test)" >> "$GITHUB_ENV"
            echo "BODY=Deploy succeeded but the post-deploy health check never returned healthy within 150s. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          else
            echo "SUBJECT=FitCloud DEPLOY succeeded" >> "$GITHUB_ENV"
            echo "BODY=Deploy + health check both passed. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: email-smtp.ap-south-1.amazonaws.com
          server_port: 465
          secure: true
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          from: FitCloud CI <ci-alerts@appkraft.info>
          to: kaushalchauhan9411@gmail.com
          subject: ${{ env.SUBJECT }}
          body: ${{ env.BODY }}
