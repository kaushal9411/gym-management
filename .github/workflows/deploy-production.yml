# ══════════════════════════════════════════════════════════════════════
# Deploy PRODUCTION — every push to `main` (after CI passes).
#
# The production box is a ~1GB t3.micro, and building api + tenant-web +
# super-admin ON it kept running out of memory (it once hung for the full
# timeout and took the live site down). So the build now happens HERE, on
# the GitHub runner (7GB RAM), and only the finished output is shipped:
#
#   1. read the production NEXT_PUBLIC_* values off the server's .env files
#      (they are baked into the browser bundle at build time)
#   2. scripts/deploy/build-release.sh  -> release.tgz  (compiled api, .next
#      for both web apps, prisma schema + migrations)
#   3. scp it to the server and run scripts/deploy/remote-finalize.sh there:
#      swap the build, prisma migrate deploy, pm2 restart, health check.
#
# The same scripts power `pnpm deploy:server` for a manual deploy from your
# own machine (see docs/DEPLOYMENT.md). No container registry / ECS / terraform
# in this project — this targets the single EC2 box running under pm2.
# ══════════════════════════════════════════════════════════════════════
name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on runner, ship to server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit CI just verified (not whatever main moved to since).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read production NEXT_PUBLIC_* from the server
        run: |
          mkdir -p "$RUNNER_TEMP/envs"
          SSH="ssh -i $HOME/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST"
          $SSH 'cat ~/gym-management/apps/tenant-web/.env' > "$RUNNER_TEMP/envs/tenant-web.env"
          $SSH 'cat ~/gym-management/apps/super-admin/.env' > "$RUNNER_TEMP/envs/super-admin.env"
          grep -q NEXT_PUBLIC_API_URL "$RUNNER_TEMP/envs/tenant-web.env"

      - name: Build release (api + tenant-web + super-admin)
        id: build
        env:
          ENV_DIR: ${{ runner.temp }}/envs
          RELEASE_OUT: ${{ runner.temp }}/release
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/deploy/build-release.sh

      - name: Ship + finalize on the server
        id: deploy
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o ServerAliveInterval=30"
          scp $SSH_OPTS "$RUNNER_TEMP/release/release.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fitcloud-release.tgz"
          scp $SSH_OPTS scripts/deploy/remote-finalize.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fitcloud-finalize.sh"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash /tmp/fitcloud-finalize.sh /tmp/fitcloud-release.tgz && rm -f /tmp/fitcloud-release.tgz /tmp/fitcloud-finalize.sh'

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 30); do
            curl -sf https://api.appkraft.info/health -o /dev/null && exit 0
            sleep 5
          done
          echo "API health check failed after 150s" && exit 1

      - name: Email result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "SUBJECT=FitCloud DEPLOY FAILED (build)" >> "$GITHUB_ENV"
            echo "BODY=The release build failed on the GitHub runner — nothing was sent to the server, production is untouched. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "SUBJECT=FitCloud DEPLOY FAILED" >> "$GITHUB_ENV"
            echo "BODY=Build succeeded but shipping/finalizing on the server failed (upload, migrate, or pm2 restart). See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          elif [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "SUBJECT=FitCloud DEPLOY partially failed (smoke test)" >> "$GITHUB_ENV"
            echo "BODY=Deploy succeeded but the post-deploy health check never returned healthy within 150s. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          else
            echo "SUBJECT=FitCloud DEPLOY succeeded" >> "$GITHUB_ENV"
            echo "BODY=Deploy + health check both passed. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: email-smtp.ap-south-1.amazonaws.com
          server_port: 465
          secure: true
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          from: FitCloud CI <ci-alerts@appkraft.info>
          to: kaushalchauhan9411@gmail.com
          subject: ${{ env.SUBJECT }}
          body: ${{ env.BODY }}
