version: 2
updates:
  # pnpm workspace root — Dependabot resolves pnpm-lock.yaml across every
  # app/package in the monorepo from this single entry, no per-app config
  # needed (apps/*, packages/*).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
