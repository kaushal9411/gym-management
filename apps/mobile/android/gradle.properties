org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin 2.3's incremental-compilation cache-closing step crashes on Windows
# when the Gradle/Pub caches live on a different drive letter than the
# project (`C:` vs this project's `D:`) — it tries to compute a relative
# path across drives, which Windows can't express
# (`IllegalArgumentException: this and base files have different roots`).
# Disabling incremental compilation avoids that code path entirely; slower
# rebuilds, but it actually completes. Safe to re-enable if this project or
# PUB_CACHE ever moves onto one drive.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
