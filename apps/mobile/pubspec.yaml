name: gym_saas_mobile
description: FitCloud mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # Networking
  dio: ^5.7.0

  # State management
  equatable: ^2.0.5

  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6

  # Secure session storage
  flutter_secure_storage: ^9.2.2

  # DI
  get_it: ^7.7.0

  # Routing
  go_router: ^14.6.2

  # Typography — Bricolage Grotesque + Hanken Grotesk (exact families used by the approved design)
  google_fonts: ^6.2.1

  # Profile photo picker (gallery/camera)
  image_picker: ^1.1.2

  # QR check-in scanner (Receptionist front-desk flow)
  mobile_scanner: ^5.2.3

  # Razorpay's native Checkout modal (platform Billing self-service upgrade/downgrade)
  razorpay_flutter: ^1.4.5

  # Opens external links (invoice download, class-booking meet links, ...)
  url_launcher: ^6.3.1

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
