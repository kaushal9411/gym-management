name: gym_saas_mobile
description: FitCloud mobile app — one Flutter binary serves every tenant (slug/QR onboarding).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# State: BLoC (flutter_bloc/equatable) · Network: dio · Storage: flutter_secure_storage
# · DI: get_it · Nav: go_router · Realtime/push: socket_io_client/firebase_*
# · Camera QR check-in: mobile_scanner · i18n: intl
dependencies:
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  get_it: ^8.0.0
  go_router: ^14.3.0
  intl: ^0.19.0
  mobile_scanner: ^6.0.2
  socket_io_client: ^2.0.3+1

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
