name: gym_saas_mobile
description: FitCloud mobile app.
publish_to: "none"
version: 0.1.3+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # Networking
  dio: ^5.7.0

  # State management
  equatable: ^2.0.5

  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6

  # Explicit system-tray notification + sound for FCM pushes, foreground and
  # background alike — Android doesn't auto-show anything while the app is
  # open (by design, every app), so we post it ourselves instead of relying
  # on inconsistent OS auto-display.
  flutter_local_notifications: ^19.4.2

  # Secure session storage
  flutter_secure_storage: ^9.2.2

  # DI
  get_it: ^7.7.0

  # Routing
  go_router: ^14.6.2

  # Typography — Bricolage Grotesque + Hanken Grotesk (exact families used by the approved design)
  google_fonts: ^6.2.1

  # Profile photo picker (gallery/camera)
  image_picker: ^1.1.2

  # QR check-in scanner (Receptionist front-desk flow)
  mobile_scanner: ^5.2.3

  # Report export (Prompt 163) — native plugins, so `flutter pub get` + a full
  # rebuild (not hot reload) is needed. Temp dir for the downloaded
  # PDF / Excel / CSV:
  path_provider: ^2.1.6

  # System print dialog for the server-rendered PDF (pulls in `pdf`)
  printing: ^5.14.3

  # Razorpay's native Checkout modal (platform Billing self-service upgrade/downgrade)
  razorpay_flutter: ^1.4.5

  # System share sheet for exports (Save to Files / Drive, open in Excel / a PDF viewer)
  share_plus: ^12.0.2

  # Opens external links (invoice download, class-booking meet links, ...)
  url_launcher: ^6.3.1

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

dependency_overrides:
  # `printing` -> `pdf` 3.12 caps `archive` below 4.1 (flutter_local_notifications
  # keeps `pdf` 3.13 out via `xml`), and `image` 4.11.0 — the newest the solver
  # would pick — calls `ZLibDecoder.decodeLazy`, which `archive` 4.0.9 lacks, so
  # it does not compile. Pin `image` to a release that does. Drop this once
  # `pdf` >= 3.13 can be resolved.
  image: ">=4.1.0 <4.11.0"

flutter:
  uses-material-design: true
